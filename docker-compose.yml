services:
  booster:
    build: .
    container_name: gh-profile-booster
    restart: always
    env_file:
      - .env
    ports:
      - "3030:3030"
    shm_size: '1gb'
    volumes:
      - ./logs:/usr/src/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3030/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
